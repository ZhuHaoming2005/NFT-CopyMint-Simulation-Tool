[package]
name = "CopyMintNFT"
version = "0.1.0"
description = "CopyMint NFT - Solana NFT copying demonstration"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "CopyMintNFT"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["metadata", "token"] }
mpl-token-metadata = "5.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release.build-override]
opt-level = "z"
